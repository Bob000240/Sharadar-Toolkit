# Local development stack for QuorumNexus (Phase 0 foundation).
#
#   docker compose up -d db redis minio   # bring up infra
#   docker compose run --rm migrate        # apply Alembic migrations
#
# Datastores:
#   db    — TimescaleDB + pgvector (the timescaledb-ha image bundles both)
#   redis — Celery broker / task queue (Phase 2)
#   minio — S3-compatible object store for the parquet bronze layer (Phase 2)

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-quorum_nexus}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-quorum_nexus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # One-shot job: build the app image and apply migrations against db.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-quorum_nexus}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
