# Alembic configuration for QuorumNexus.
# The database URL is NOT stored here — it is resolved at runtime from the
# environment in migrations/env.py (see database.db_connection.get_database_url).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Use a zero-padded incrementing scheme for human-readable migration order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
