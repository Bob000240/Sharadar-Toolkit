[project]
name = "quorumnexus"
version = "0.1.0"
description = "Distributed, cloud-native quant data platform (TimescaleDB + pgvector)"
requires-python = ">=3.11"
dependencies = [
    # Data / numerics
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15.0",            # parquet bronze layer (data lake)
    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pgvector>=0.2.5",
    "python-dotenv>=1.0",
    # Market / macro data sources
    "alpaca-py>=0.20",
    "yfinance>=0.2.40",
    "fredapi>=0.5",
    "requests>=2.31",
    # AI layer (kept until Phase 3 rebuild; provider-pluggable)
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Source-layout project: packages live at the repo root.
packages = [
    "database",
    "raw_data",
    "processed_data",
    "signals",
]

[tool.ruff]
line-length = 100
target-version = "py311"
