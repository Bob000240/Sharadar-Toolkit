[project]
name = "sharadar-toolkit"
version = "0.1.0"
description = "Point-in-time equity research platform over Sharadar data"
requires-python = ">=3.14"
dependencies = [
    "nasdaq-data-link",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "psycopg2-binary",
    "python-dotenv",
    "sqlalchemy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
