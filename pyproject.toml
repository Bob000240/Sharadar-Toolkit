[project]
name = "quorumnexus"
version = "0.1.0"
description = "Agentic AI Portfolio Manager"
requires-python = ">=3.14"
dependencies = [
    "alpaca-py>=0.43.4",
    "fredapi>=0.5.2",
    "nasdaq-data-link>=1.0.4",
    "ndlbulkdownload>=0.2.0",
    "numpy>=2.4.6",
    "openai>=2.43.0",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]
